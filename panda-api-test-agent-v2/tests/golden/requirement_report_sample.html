<script>
(function(){
"use strict";
const data=JSON.parse(document.getElementById("report-payload").textContent),view=data.view,summary=view.summary,labels=data.labels||{},root=document.getElementById("report-app");
const esc=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const raw=v=>v==null?"":typeof v==="string"?v:JSON.stringify(v,null,2);const joined=(v,e="-")=>(v||[]).filter(Boolean).join("、")||e;const badge=v=>{const k=String(v||"unknown");return `<span class="chip s-${esc(k)}">${esc(labels[k]||k)}</span>`};
const cases=(view.scenarios||[]).flatMap(s=>s.cases||[]),passed=cases.filter(c=>c.status==="passed").length,failed=cases.filter(c=>c.status==="failed").length,blocked=cases.filter(c=>c.status==="blocked").length,completeEvidence=cases.filter(c=>(c.exchanges||[]).some(x=>!x.request_missing&&!x.response_missing)).length;
const closureMeta={direct:["接口可闭环","接口响应与现有证据可直接闭合"],partial:["接口部分闭环","部分事实仍需要接口外证据"],none:["接口不可闭环","公开接口无法完成该项验证"]};
const coverage=()=>((view.coverage&&view.coverage.groups)||[]).map(group=>`<details class="closure ${esc(group.id)}"><summary><div class="closure-title"><strong>${esc(closureMeta[group.id][0])}</strong><span>${esc(closureMeta[group.id][1])}</span></div><span class="closure-count">${group.items.length}</span></summary><div class="closure-items">${group.items.map(item=>`<article class="closure-item"><strong>${esc(item.id)} · ${esc(item.title)}</strong> ${badge(item.verdict)}<p>${esc(item.actual||item.verifiability_reason||"")}</p><div class="scene-list">${(item.scenarios||[]).map(s=>`<span class="scene-tag">${esc(s)}</span>`).join("")||'<span class="muted">未映射场景</span>'}</div></article>`).join("")||'<p class="empty">无</p>'}</div></details>`).join("");
const interfaces=()=> (view.interfaces||[]).map(item=>`<details class="interface"><summary><div class="interface-title"><code>${esc(item.method)} ${esc(item.path)}</code></div>${badge(item.result)}</summary><div class="interface-body"><div class="scene-list">${(item.scenarios||[]).map(s=>`<span class="scene-tag">${esc(s)}</span>`).join("")}</div><p>${esc(joined(item.purposes,"无检查用途"))}</p><div class="interface-facts"><div class="fact"><span>关联用例</span><strong>${item.case_count}</strong></div><div class="fact"><span>请求证据</span><strong>${item.exchange_count}</strong></div><div class="fact"><span>结果</span><strong>${esc(labels[item.result]||item.result)}</strong></div></div></div></details>`).join("")||'<p class="empty">无接口</p>';
const layerNames={http:"HTTP",db:"DB",cache:"Cache",mq:"MQ",log:"日志",other:"其他"};
function checkpoints(item){const groups=item.checkpoints_by_layer||{};return `<details class="checkpoint-set"><summary><strong>检查点</strong><span>${(item.checkpoints||item.assertions||[]).length} 项</span></summary><div class="checkpoint-body"><div class="layer-tabs">${Object.keys(layerNames).map((k,i)=>`<button class="layer-tab${i===0?' active':''}" data-layer="${k}">${layerNames[k]} ${(groups[k]||[]).length}</button>`).join("")}</div>${Object.keys(layerNames).map((k,i)=>`<div class="layer-panel${i===0?' active':''}" data-panel="${k}">${(groups[k]||[]).map(cp=>`<article class="checkpoint"><div class="checkpoint-head"><strong>${esc(cp.name)}</strong>${badge(cp.status)}</div><div class="raw-grid"><div class="raw"><label>预期原始值</label><pre>${esc(raw(cp.expected))}</pre></div><div class="raw"><label>实际原始值</label><pre>${esc(raw(cp.actual))}</pre></div></div>${cp.evidence_ref?`<div class="evidence-ref">${esc(cp.evidence_ref)}</div>`:""}</article>`).join("")||`<p class="empty">${layerNames[k]}：0</p>`}</div>`).join("")}</div></details>`}
function exchanges(item){return (item.exchanges||[]).map((x,i)=>`<details class="exchange"><summary class="exchange-summary"><div class="summary-title"><strong>EX-${String(i+1).padStart(2,"0")} · ${esc(x.label)} · ${esc(x.method||"-")} ${esc(x.path||"-")}</strong><span>${x.status!=null?`HTTP ${esc(x.status)}`:"原始 HTTP 证据"}</span></div></summary><div class="exchange-body"><code>${esc(x.evidence_ref)}</code>${x.curl?`<div class="exchange-tools"><button class="copy-curl" data-curl="${esc(x.curl)}">复制为 cURL</button></div>`:""}<div class="http-grid"><div><span class="http-label">Request</span><pre>${esc(x.request)}</pre></div><div><span class="http-label">Response</span><pre>${esc(x.response)}</pre></div></div></div></details>`).join("")||'<p class="empty">原始请求/响应缺失</p>'}
function scenarioBlocks(){return (view.scenarios||[]).map((s,i)=>`<details class="scenario" data-state="${esc(s.state)}"><summary class="scenario-summary"><div class="summary-title"><strong>场景 ${String(i+1).padStart(2,"0")} · ${esc(s.name)}</strong><span>${s.case_count} 条用例 · ${s.assertion_count} 个检查点</span></div>${badge(s.state)}</summary><div class="scenario-body">${(s.cases||[]).map(item=>`<details class="case" data-state="${esc(item.status)}"><summary class="case-summary"><div class="summary-title"><strong>${esc(item.id)} · ${esc(item.name)}</strong><span>${esc(joined((item.planned_requests||[]).map(r=>`${r.method} ${r.path}`),"未声明请求"))}</span></div>${badge(item.status)}</summary><div class="case-body"><div class="case-facts"><div class="fact"><span>验收引用</span><strong>${esc(joined(item.acceptance_refs,"未映射"))}</strong></div><div class="fact"><span>检查点</span><strong>${(item.checkpoints||item.assertions||[]).length}</strong></div><div class="fact"><span>请求证据</span><strong>${(item.exchanges||[]).length}</strong></div></div>${checkpoints(item)}<h4>完整原始请求与响应</h4>${exchanges(item)}</div></details>`).join("")}</div></details>`).join("")}
function issueCards(items,label){return (items||[]).map(x=>`<article class="issue-card">${x.status?badge(x.status):""}<h3>${esc(x.id||x.run_id||label)} · ${esc(x.title||x.kind||label)}</h3><p>${esc(x.actual||x.detail||x.reason||"")}</p></article>`).join("")||`<article class="issue-card"><h3>无${esc(label)}</h3></article>`}
root.innerHTML=`<header class="report-header"><div class="header-main"><div><div class="eyebrow">需求接口验收报告 · ${esc(data.report_id)}</div><h1>${esc(data.requirement.id)} · ${esc(data.requirement.title)}</h1><div class="report-meta"><span>环境：${esc(data.baseline.environment||"-")}</span><span>代码基线：${esc(data.baseline.branch||"-")} · ${esc(data.baseline.commit||"-")}</span><span>生成时间：${esc(data.generated_at)}</span></div></div><aside class="decision"><div class="decision-label">总体结论</div><div class="verdict v-${esc(data.verdict)}">${esc(data.verdict)}</div><p>${esc(data.verdict_reason)}</p><strong>${esc(data.release_recommendation)}</strong></aside></div><div class="core-metrics"><div class="core-card"><span>接口执行结果</span><strong>${passed}/${cases.length} 用例通过</strong><small>${failed} 失败 · ${blocked} 阻塞</small></div><div class="core-card"><span>需求验收结果</span><strong>${summary.passed}/${summary.acceptance_total} 验收项通过</strong><small>其余按闭环能力查看</small></div><div class="core-card"><span>证据完整度</span><strong>${completeEvidence}/${cases.length} 用例</strong><small>包含完整请求与响应</small></div></div></header><section class="panel" id="coverage"><div class="section-head"><div><h2>1. 需求覆盖</h2><p>仅按接口可闭环、部分闭环、不可闭环三类展示。</p></div></div><div class="closure-grid">${coverage()}</div></section><section class="panel" id="interfaces"><div class="section-head"><div><h2>2. 需求涉及接口</h2><p>点击接口按需查看场景、检查用途和证据统计。</p></div></div>${interfaces()}</section><section class="panel" id="details"><div class="section-head"><div><h2>3. 场景、用例与检查证据</h2><p>场景、用例、检查点和原始报文均按需展开。</p></div></div><div class="toolbar"><button class="filter-btn active" data-filter="all">全部</button><button class="filter-btn" data-filter="failed">失败</button><button class="filter-btn" data-filter="passed">通过</button><button class="filter-btn" data-filter="open">未闭合</button><button class="filter-btn" data-filter="blocked">阻塞</button></div><div class="scenario-list">${scenarioBlocks()}</div></section><section class="panel" id="issues"><div class="section-head"><div><h2>4. 问题、缺口与残留风险</h2></div></div><div class="issue-grid">${issueCards(view.issues,"产品缺陷")}${issueCards(view.gaps,"测试缺口")}${issueCards(view.residual_risks,"残留风险")}</div></section><section class="panel" id="evidence-index"><div class="section-head"><div><h2>证据索引</h2></div></div><p>${(view.run_index||[]).map(x=>`<code>${esc(x.id)}</code> ${esc(x.status)}`).join("<br>")}</p></section><footer class="audit">Report ${esc(data.report_id)} · Template ${esc(data.template_id)}@${esc(data.template_version)} · base-css:${esc(data.base_css_sha256)} · Report View ${esc(view.report_view_version)}</footer>`;
const nav=`<input class="nav-search" placeholder="搜索用例 / 检查点 / 报文"><a href="#report-app">执行摘要</a><a href="#coverage">需求覆盖</a><a href="#interfaces">接口视图</a><a href="#details">用例与证据</a><a href="#issues">问题与缺口</a><a href="#evidence-index">证据索引</a>`;document.body.insertAdjacentHTML("beforeend",`<aside class="side-nav"><strong>需求验收报告</strong><small>${esc(data.requirement.id)}</small>${nav}</aside><header class="mobile-top"><button class="mobile-btn" data-menu>☰</button><div class="mobile-title"><strong>${esc(data.requirement.id)}</strong><span>${esc(data.verdict)}</span></div><button class="mobile-btn" data-top>↑</button></header><aside class="mobile-drawer">${nav}</aside><nav class="mobile-bottom"><a href="#report-app">摘要</a><a href="#coverage">覆盖</a><a href="#interfaces">接口</a><a href="#details">用例</a><a href="#issues">问题</a></nav>`);
document.querySelectorAll(".layer-tabs").forEach(tabs=>tabs.addEventListener("click",e=>{const b=e.target.closest("[data-layer]");if(!b)return;const box=tabs.parentElement;box.querySelectorAll(".layer-tab").forEach(x=>x.classList.toggle("active",x===b));box.querySelectorAll(".layer-panel").forEach(x=>x.classList.toggle("active",x.dataset.panel===b.dataset.layer))}));document.querySelectorAll(".copy-curl").forEach(b=>b.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(b.dataset.curl);b.textContent="cURL 已复制"}catch(e){b.textContent="复制失败"}setTimeout(()=>b.textContent="复制为 cURL",1200)}));
const searches=document.querySelectorAll(".nav-search");searches.forEach(input=>input.addEventListener("input",()=>{const q=input.value.trim().toLowerCase();searches.forEach(x=>{if(x!==input)x.value=input.value});document.querySelectorAll(".case").forEach(c=>{const hit=!q||c.textContent.toLowerCase().includes(q);c.hidden=!hit;if(q&&hit)c.open=true});document.querySelectorAll(".scenario").forEach(s=>s.hidden=![...s.querySelectorAll(".case")].some(c=>!c.hidden))}));document.querySelector("[data-menu]").addEventListener("click",()=>document.querySelector(".mobile-drawer").classList.toggle("open"));document.querySelector("[data-top]").addEventListener("click",()=>scrollTo({top:0,behavior:"smooth"}));document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".scenario").forEach(s=>s.hidden=b.dataset.filter!=="all"&&s.dataset.state!==b.dataset.filter)}));document.title=`${data.requirement.id} 需求接口验收报告`;
})();
</script>
</body>
</html>
